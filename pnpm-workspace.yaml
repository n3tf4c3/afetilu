packages:
  - apps/*
  - packages/*

# Versões que precisam ser únicas na árvore (par React do Expo SDK 58).
catalog:
  react: 19.3.0
  react-dom: 19.3.0

# Convenção da casa para apps Expo em monorepo.
nodeLinker: hoisted

# Scripts de instalação só rodam se aprovados, um a um, com o motivo.
allowBuilds:
  # baixa o binário nativo usado pelo tsx (runner dos testes)
  esbuild: true
  # o binário nativo já vem por dependência opcional; o postinstall é só fallback de download
  unrs-resolver: false

# Exceção de zod à trava de versões recém-publicadas. Revisar a cada atualização.
minimumReleaseAgeExclude:
  - zod@4.6.7

overrides:
  # A configuração do Metro acompanha a versão do React Native usada pelo Expo.
  '@react-native/metro-config': 0.88.1
  # GHSA-g3hv-75wg-m249. Remover quando os consumidores aceitarem minimatch 11.
  '@expo/fingerprint>minimatch@10': 11.0.9
  '@typescript-eslint/typescript-estree>minimatch@10': 11.0.9

patchedDependencies:
  react-native-filament@1.11.0: patches/react-native-filament@1.11.0.patch
