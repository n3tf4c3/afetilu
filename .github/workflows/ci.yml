name: CI

# Só manual (aba Actions > CI > Run workflow): as checagens rodam localmente antes do push
# (pnpm lint, typecheck, test) para não gastar minutos do GitHub Actions a cada envio.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # 24.22.3: release de segurança de novembro de 2026
          # (https://nodejs.org/en/blog/vulnerability/november-2026-security-releases).
          # Manter igual ao "node" do apps/mobile/eas.json.
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: expo-doctor
        working-directory: apps/mobile
        run: npx --yes expo-doctor@latest
